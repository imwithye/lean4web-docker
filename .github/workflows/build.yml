name: Build & publish image

on:
  # Check daily for a new lean4web release
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "lean4web release tag (e.g. v0.2.2). Empty = latest release"
        required: false
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: leanprover-community/lean4web
  IMAGE: ghcr.io/${{ github.repository_owner }}/lean4web

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            # Make sure it is an actual release, not a branch
            gh release view "$VERSION" -R "$UPSTREAM" >/dev/null
          else
            VERSION=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          fi
          LATEST=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_latest=$([ "$VERSION" = "$LATEST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$FORCE" != "true" ] && \
             docker manifest inspect "$IMAGE_LC:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE_LC:$VERSION already exists, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (Mathlib is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is_latest == 'true' }}
            type=raw,value=${{ needs.resolve.outputs.version }}-{{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: LEAN4WEB_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
